services:
  postgres:
    image: postgres:17-alpine
    container_name: projects_postgres
    restart: always
    ports:
      - "9004:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gazella-net

  project-data-service:
    image: project-data-service
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_data_service
    ports:
      - "8200:8080"
    networks:
      - gazella-net
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  gazella-net:
    external: true